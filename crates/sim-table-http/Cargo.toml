[package]
name = "sim-table-http"
version = "0.1.1"
edition = "2024"
license = "MPL-2.0"
description = "Capability-gated HTTP table directory backend for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-storage"
homepage = "https://github.com/sim-nest/sim-storage"

[dependencies]
sim-citizen = { version = "0.2.0" }
sim-citizen-derive = { version = "0.2.0" }
sim-codec = { version = "0.1.7" }
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-net-http = { version = "0.1.0" }
sim-table-core = { version = "0.1.1" }

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[dev-dependencies]
sim-codec-lisp = { version = "0.2.0" }
sim-kernel = { version = "0.2.0", features = ["test-support"] }
sim-test-support = { version = "0.1.0" }

[features]
default = []
tls = ["sim-lib-net-http/tls"]

[lints]
workspace = true
