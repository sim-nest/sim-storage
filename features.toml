schema = "sim.features"

[enforcement.audience]
framework = "strict"
code = "strict"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-storage/artifact-facet-law"
title = "Role-safe artifact facet law"
summary = "Classify and merge exact base, observed, and intended artifact images under singular owner, region, generated-owner, disclosure, and bounded merge declarations."
owner = "crate/sim-artifact-facet"
audiences = ["code", "framework"]
guidance = "Reuse this pure law from packet checking and durable mutation rather than implementing another three-way comparison. Bind filesystem durability, rollback, Git state, and audit policy in higher adapters."
claims_anchors = ["anchor/crate/sim-artifact-facet"]
claims_specimens = ["spec-test/sim-storage/crates/sim-artifact-facet/tests/facet_law"]

[[feature]]
id = "feature/sim-storage/atomic-content-journal"
title = "Atomic content journal"
summary = "Crash-durably publish immutable content and atomically advance one gapless, fenced journal head with bounded verified reopen and disposable read-only projections."
owner = "crate/sim-lib-journal"
audiences = ["code", "framework"]
guidance = "Compose this domain-free journal for durable facts. New entries are canonical journal/entry-v2 Datums and payload ids name semantic values; storage ids and entry locators remain inside the backend. Bind HostDirPort through HostDirJournalBackend only when its capability report attests linearizable CAS and durable publication. Opening a retained SIMJSTATE1 prefix verifies its exact old byte law and projects only canonical entries; the first writer atomically selects a fresh isolated v2 namespace."
claims_anchors = [
  "anchor/crate/sim-lib-journal",
]
claims_specimens = [
  "spec-test/sim-storage/crates/sim-lib-journal/src/tests",
]

[[feature]]
id = "feature/sim-storage/persistent-semantic-objects"
title = "Owned-return persistent semantic objects"
summary = "Persist canonical Datums over the journal object backend while keeping semantic identities distinct from exact-byte storage locators."
owner = "crate/sim-lib-journal"
audiences = ["code", "framework"]
guidance = "Open PersistentObjectStore over the same JournalBackend used for durable facts. Put returns a StoredDatumRef containing separate meaning and storage ids; get returns an owned Datum and rechecks its meaning. Treat the semantic-to-storage index as derived: rebuild and verify it after index loss, and retain a journal root before treating an object as durable execution evidence."
claims_anchors = ["anchor/rustdoc/sim-lib-journal/persistent-semantic-objects"]
supports = ["feature/sim-storage/atomic-content-journal"]

[[route]]
id = "route/store-persistent-semantic-objects"
task = "Persist semantic Datums without confusing meaning with storage bytes"
audiences = ["framework"]
steps = [
  { feature = "feature/sim-storage/persistent-semantic-objects", why = "The owned-return facet verifies the kernel Datum id, exact storage id, and rebuildable correspondence over the existing journal backend." },
  { specimen = "spec-test/sim-storage/crates/sim-lib-journal/src/tests", why = "The conformance suite exercises canonical put, owned get, exact index rebuild, and corrupt or missing content refusal through the public facet." },
]

[[feature]]
id = "feature/sim-storage/mutual-copied-projection"
title = "Two-key mutual copied projection"
summary = "Copy one Shape-admitted fact and provenance between opaque peer archives only after two independent acceptances, with expiry, revocation, and minimum tombstones."
owner = "crate/sim-mutual-projection"
audiences = ["code", "framework"]
guidance = "Use MutualPorch when peers share selected facts but must never mount or query one another's stores. Keep key providers and archives outside the porch; bind both key identities, the exact field Shape, content identity, provenance, and expiry in the immutable offer."
claims_anchors = ["anchor/crate/sim-mutual-projection"]
claims_specimens = ["spec-test/sim-storage/crates/sim-mutual-projection/src/tests"]
supports = [
  "feature/sim-storage/atomic-content-journal",
  "feature/sim-storage/table-dir-backends",
  "feature/sim-foundation/table-dir-core",
]

[[feature]]
id = "feature/sim-storage/sealed-table-decorator"
title = "Sealed authenticated Table/Dir decorator"
summary = "Wrap Table/Dir storage with authenticated encryption and manage crash-safe, independently granted generations, wrapped-only backups, recovery, and bounded crypto-erasure evidence."
owner = "crate/sim-table-sealed"
audiences = ["code", "framework"]
guidance = "Compose SealedTable around a persistent Table/Dir only after the host injects revocable key and nonce providers. Use GenerationManager for independently granted ordinary, finance, and private-observation generations: stage ciphertext and authenticated manifest before atomic selection, back up only wrapped envelopes, and describe managed destruction with provider receipts, negative probes, residual leakage, and an explicit exclusion for unmanaged plaintext."
claims_anchors = ["anchor/crate/sim-table-sealed"]
claims_specimens = [
  "spec-test/sim-storage/crates/sim-table-sealed/src/tests",
]
supports = [
  "feature/sim-storage/table-dir-backends",
]

[[feature]]
id = "feature/sim-storage/table-dir-backends"
title = "Table and Dir backends"
summary = "Provide hash, database, mounted, and view Table/Dir implementations, with honest linearizable compare-exchange where the backend can establish one atomic boundary."
owner = "crate/sim-table-hash"
audiences = ["code", "framework"]
guidance = "Use compare-exchange on hash, database, or a mounted supporting backend for leases and claims; absent, stored nil, delete, and value are distinct. Lazy, override, HTTP, and other views return Unsupported unless they can prove one linearization point."
claims_anchors = [
  "anchor/crate/sim-list-cell",
  "anchor/crate/sim-list-lazy",
  "anchor/crate/sim-table-hash",
  "anchor/crate/sim-table-lazy",
  "anchor/crate/sim-table-override",
  "anchor/runtime-lib/sim-list-cell/cons-list-lib",
  "anchor/runtime-lib/sim-list-lazy/lazy-list-lib",
  "anchor/runtime-lib/sim-table-hash/hash-table-lib",
  "anchor/runtime-lib/sim-table-lazy/lazy-table-lib",
  "anchor/runtime-lib/sim-table-override/override-table-lib",
]
claims_specimens = ["spec-test/sim-storage/crates/sim-table-hash/src/tests"]

[[feature]]
id = "feature/sim-storage/relation-table-dir-projection"
title = "Relation-backed Table/Dir and keyed query views"
summary = "Project a D9 node relation as a transactional Table/Dir namespace and admitted uniquely keyed query results as deterministic read-only tables."
owner = "crate/sim-table-relation"
audiences = ["code", "framework"]
guidance = "Compose RelationDir with sim-table-core paths and MountedDir; retain codec identity, canonical Table CAS publication, and independent relation and Table/Dir capabilities. Use RelationView only with a non-null admitted unique key projection."
claims_anchors = ["anchor/crate/sim-table-relation"]
claims_specimens = [
  "spec-test/sim-storage/crates/sim-table-relation/src/tests",
  "spec-test/sim-storage/crates/sim-table-override/src/install",
]
supports = [
  "feature/sim-storage/table-dir-backends",
  "feature/sim-storage/mounted-table-dir-namespace",
  "feature/sim-foundation/table-dir-core",
]
[[feature]]
id = "feature/sim-storage/mounted-table-dir-namespace"
title = "Mounted Table/Dir namespace"
summary = "Compose multiple Table and Dir backends behind one mounted table dir namespace with explicit mount points."
owner = "crate/sim-table-mount"
audiences = ["code", "framework"]
guidance = "Use this row when a feature needs one mounted table dir namespace assembled from independently owned backends."
claims_anchors = [
  "anchor/crate/sim-table-mount",
  "anchor/runtime-lib/sim-table-mount/mount-dir-lib",
]
claims_specimens = [
  "spec-test/sim-storage/crates/sim-table-mount/src/tests",
]
supports = [
  "feature/sim-storage/table-dir-backends",
]

[[feature]]
id = "feature/sim-storage/host-storage-primitives"
title = "Host storage primitives"
summary = "Define the portable HostDirPort boundary used by Table/Dir policy, including byte-level compare-exchange at the platform-owned atomic publication boundary."
owner = "crate/sim-storage-port"
audiences = ["code", "framework"]
guidance = "Use HostDirPort compare-exchange for atomic leaf publication; keep locks, native paths, handles, filesystem semantics, and physical crash tests in a platform capsule. sim-table-http retains its Table/Dir API but delegates generic blocking HTTP framing, caps, deadlines, TLS policy, and sensitive headers to feature/sim-foundation/blocking-http-client."
claims_anchors = [
  "anchor/crate/sim-table-db",
  "anchor/crate/sim-storage-port",
  "anchor/crate/sim-table-http",
]
claims_specimens = ["spec-test/sim-storage/crates/sim-table-db/src/tests"]

[[feature]]
id = "feature/sim-storage/bounded-relation-site"
title = "Bounded logical relation site"
summary = "Realize sealed checked relational plans through a provider-neutral, capability-gated, bounded host effect seam."
owner = "crate/sim-relation-site"
audiences = ["code", "framework"]
guidance = "Compose this site with relation plan and migration admission. Providers validate opaque locators internally and receive no text execution surface; callers receive typed pushed rows and redacted receipts."
claims_anchors = [
  "anchor/crate/sim-relation-site",
  "anchor/runtime-lib/sim-relation-site/relation-site-lib",
]
claims_specimens = [
  "spec-test/sim-storage/crates/sim-relation-site/src/tests",
]

[[feature]]
id = "feature/sim-storage/sqlite-relation-locator"
title = "Closed SQLite relation locator and driver identity"
summary = "Admit only memory or capability-bearing preopened storage references and one canonical SQLite provider registration without exposing native paths or SQL."
owner = "crate/sim-relation-site"
audiences = ["code", "framework"]
guidance = "Use StorageLocator and DriverManifest at the logical relation boundary. A selected platform capsule resolves preopened references and owns all driver values, paths, prepared text, and provider mechanics."
claims_specimens = ["spec-test/sim-storage/crates/sim-relation-site/src/sqlite_locator_tests"]
supports = ["feature/sim-storage/bounded-relation-site"]

[[feature]]
id = "feature/sim-storage/contract-emitter"
title = "Storage contract emitter"
summary = "Emit generated repository contract and index fragments for storage crates."
owner = "crate/xtask"
audiences = ["code"]
guidance = "Use this row when refreshing generated storage contract evidence."
claims_anchors = [
  "anchor/crate/xtask",
]
supports = [
  "feature/sim-storage/table-dir-backends",
]

[[feature]]
id = "feature/sim-storage/relation-command"
title = "Checked relation command library"
summary = "Discover and operate loaded relational sites through named schemas, migrations, checked plans, explicit product authorization, and bounded Table/Dir output without a raw SQL escape hatch."
owner = "crate/sim-lib-relation-cli"
audiences = ["user", "code", "framework"]
guidance = "Load this library through sim relation. Compose provider sessions behind RelationCommands; keep native paths, SQL text, and provider mechanics inside platform capsules. Mutation, adoption, and apply operations must bind --authorize to the exact --expect-plan identity rendered before action."
claims_anchors = [
  "anchor/crate/sim-lib-relation-cli",
  "anchor/export/sim-lib-relation-cli/cli/main/relation",
  "anchor/runtime-lib/sim-lib-relation-cli/relation-command-lib",
]
claims_specimens = [
  "spec-test/sim-storage/crates/sim-lib-relation-cli/src/tests",
]
supports = [
  "feature/sim-foundation/relation-core",
  "feature/sim-foundation/relation-schema",
  "feature/sim-foundation/relation-plan",
  "feature/sim-foundation/relation-migrate",
  "feature/sim-shape/relation-shape",
  "feature/sim-codecs/sql-projection",
  "feature/sim-storage/bounded-relation-site",
  "feature/sim-storage/sqlite-relation-locator",
  "feature/sim-storage/relation-table-dir-projection",
  "feature/sim-storage/mounted-table-dir-namespace",
  "feature/sim-office/office-site-workflows",
  "feature/sim-ledger/ledger-libraries",
  "feature/sim-sdk/relation-composition",
]

[[route]]
id = "route/add-relation-provider"
task = "Add a logical relation provider"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-storage/bounded-relation-site", why = "The site owns placement, checked provider traits, bounds, capabilities, effects, transactions, and receipts." },
  { specimen = "spec-test/sim-storage/crates/sim-relation-site/src/tests", why = "The recording provider proves the effect seam without implementing SQL or relational evaluation." },
]

[[route]]
id = "route/operate-relational-data"
task = "Discover inspect migrate query mutate or mount a database relation schema SQLite site or SQL projection"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-foundation/relation-core", why = "The provider-neutral logical relation framework owns rows, domains, and identities." },
  { feature = "feature/sim-shape/relation-shape", why = "Shape admits relation values and command artifacts." },
  { feature = "feature/sim-codecs/sql-projection", why = "The SQL codec is a projection of checked plans, never a command escape hatch." },
  { feature = "feature/sim-foundation/relation-migrate", why = "Migration admission and drift checks precede physical action." },
  { feature = "feature/sim-storage/bounded-relation-site", why = "The site contract gates provider effects and bounds." },
  { feature = "feature/sim-storage/sqlite-relation-locator", why = "SQLite is selected through a closed provider identity and opaque locator." },
  { feature = "feature/sim-storage/relation-table-dir-projection", why = "Results render through standard Table/Dir composition." },
  { feature = "feature/sim-office/office-site-workflows", why = "Office workflows reuse relational sites rather than copying storage behavior." },
  { feature = "feature/sim-ledger/ledger-libraries", why = "Ledger composition supplies durable domain reuse." },
  { feature = "feature/sim-sdk/relation-composition", why = "The SDK facade exposes the supported relation composition." },
  { feature = "feature/sim-storage/relation-command", why = "The loadable command parses only named, authorized, bounded operations." },
  { specimen = "spec-test/sim-storage/crates/sim-lib-relation-cli/src/tests", why = "Checked specimens cover creation, inspection, adoption, drift refusal, query, mutation, providers, and mounts." },
]

[[route]]
id = "route/seal-table-dir-backend"
title = "Seal a Table/Dir backend"
audiences = ["framework", "code"]
steps = [
  { feature = "feature/sim-foundation/table-dir-core", why = "Keep the canonical Table and Dir contracts." },
  { feature = "feature/sim-storage/table-dir-backends", why = "Select the persistent backend that continues to own storage semantics." },
  { feature = "feature/sim-storage/sealed-table-decorator", why = "Inject host-owned key and nonce services, then wrap the backend with lane-bound authenticated encryption." },
  { specimen = "spec-test/sim-storage/crates/sim-table-sealed/src/tests", why = "The checked fixture proves the host/Lisp authority boundary, persistent Dir composition, and fail-closed authenticated bindings." },
]

[[route]]
id = "route/add-table-dir-backend"
task = "Add a Table or Dir backend"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-storage/table-dir-backends", why = "The backend row owns reusable Table and Dir implementations." },
  { feature = "feature/sim-storage/mounted-table-dir-namespace", why = "The mounted namespace row composes independently owned backends without copying their storage behavior." },
  { feature = "feature/sim-storage/contract-emitter", why = "The emitter row keeps generated storage contract evidence current." },
  { specimen = "recipe/sim-storage/crates/sim-table-mount/01-basics/backend-composition", why = "The backend-composition recipe exercises the mounted Table/Dir surface." },
]

[[route]]
id = "route/add-host-storage-primitive"
task = "Add a host storage primitive"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-storage/host-storage-primitives", why = "The host storage row points to file, database, and HTTP backends." },
]
