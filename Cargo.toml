
[workspace]
resolver = "3"
members = [
  "crates/sim-lib-journal",
  "crates/sim-list-cell",
  "crates/sim-list-lazy",
  "crates/sim-relation-site",
  "crates/sim-table-db",
  "crates/sim-storage-port",
  "crates/sim-table-hash",
  "crates/sim-table-http",
  "crates/sim-table-lazy",
  "crates/sim-table-mount",
  "crates/sim-table-relation",
  "crates/sim-table-override",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-storage"
homepage = "https://github.com/sim-nest/sim-storage"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
sim-cookbook = { path = "../sim-foundation/crates/sim-cookbook" }
sim-cookbook-build = { path = "../sim-foundation/crates/sim-cookbook-build" }
sim-codec = { path = "../sim-codecs/crates/sim-codec" }
sim-codec-lisp = { path = "../sim-codecs/crates/sim-codec-lisp" }
sim-lib-net-http = { path = "../sim-foundation/crates/sim-lib-net-http" }
sim-lib-net-core = { path = "../sim-foundation/crates/sim-lib-net-core" }
sim-kernel = { path = "../sim-kernel" }
sim-table-db = { path = "crates/sim-table-db" }
sim-test-support = { path = "../sim-codecs/crates/sim-test-support" }
